<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kovács Műhelye — Logika Műhely</title>
  <meta name="description" content="Dienes-féle logikai játék elsősöknek: halmazok, tagadás, metszet és szabályfelismerés magyar hangalámondással.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="workshop-body">
  <header class="workshop-header">
    <div class="container workshop-header-inner">
      <div class="header-left">
        <a href="../index.html" class="back-link" id="btn-back-home">← Főoldal</a>
        <h1 class="workshop-title">🔨 Kovács Műhelye</h1>
      </div>

      <div class="header-controls">
        <span class="stat-pill" id="star-counter" aria-label="Összegyűjtött csillagok">
          ⭐ <span id="star-count-value">0</span>
        </span>
        <button type="button" class="icon-btn" id="btn-infinite-mode" aria-pressed="false" title="Végtelen gyakorlás be/ki">
          ∞ <span class="btn-label">Végtelen</span>
        </button>
        <button type="button" class="icon-btn" id="btn-replay-voice" title="Feladat meghallgatása újra">
          🗣️ <span class="btn-label">Hallgasd</span>
        </button>
        <button type="button" class="icon-btn" id="btn-toggle-sound" aria-pressed="true" title="Hang ki/be">
          🔊
        </button>
      </div>
    </div>
  </header>

  <main class="container workshop-main">
    <nav class="mode-nav" aria-label="Játékmódok">
      <button type="button" class="mode-tab is-active" id="tab-mode-anvil" data-mode="anvil">
        <span>🔨</span>
        <span>1. Üllő Próbája</span>
      </button>
      <button type="button" class="mode-tab" id="tab-mode-venn" data-mode="venn">
        <span>⭕</span>
        <span>2. Bűvös Karikák</span>
      </button>
      <button type="button" class="mode-tab" id="tab-mode-secret" data-mode="secret">
        <span>🔍</span>
        <span>3. Titkos Szabály</span>
      </button>
    </nav>

    <section class="game-panel" aria-live="polite">
      <div class="prompt-bar">
        <div class="prompt-left">
          <div class="blacksmith-avatar" aria-hidden="true">🧔🏾‍♂️</div>
          <div class="prompt-text-group">
            <span class="level-badge" id="level-badge">1. szint</span>
            <p class="prompt-instruction" id="prompt-instruction">Töltsük be a kovácsműhelyt…</p>
          </div>
        </div>
        <div class="prompt-right">
          <div class="attempts-hearts" id="attempts-display" aria-label="Hátralévő próbák">
            🔥🔥🔥
          </div>
        </div>
      </div>

      <!-- Visual Rule Blueprint (shown in Anvil mode, hidden in others if needed) -->
      <div class="rule-blueprint" id="rule-blueprint" aria-label="Vizuális szabály"></div>

      <!-- Dynamic Stage (Anvil / Venn / Secret Rule) -->
      <div id="game-stage"></div>

      <!-- Token Tray -->
      <div class="tray-section" id="tray-section">
        <div class="tray-header">
          <span>Formák a ládában (húzd át, vagy koppints rá, majd a célhelyre!)</span>
          <span id="tray-count"></span>
        </div>
        <div class="token-tray drop-target" id="token-tray" data-zone="tray"></div>
      </div>

      <!-- Action & Feedback Bar -->
      <div class="action-bar">
        <div class="feedback-banner" id="feedback-banner">
          <span>💡</span>
          <span id="feedback-text">Válassz egy formát, és tedd a megfelelő helyre!</span>
        </div>
        <div class="action-buttons" id="action-buttons"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
