<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postás Süni — Logika Műhely</title>
  <meta name="description" content="Gráfelmélet és útvonal-tervezés elsősöknek: kézbesíts minden házba és menj át minden hídon pontosan egyszer!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../styles/main.css?v=4">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="suni-body">
  <header class="workshop-header">
    <div class="container workshop-header-inner">
      <div class="header-left">
        <a href="../index.html" class="back-link" id="btn-back-home">← Főoldal</a>
        <h1 class="workshop-title">🦔 Postás Süni</h1>
      </div>

      <div class="header-controls">
        <span class="stat-pill" id="star-counter" aria-label="Összegyűjtött csillagok">
          ⭐ <span id="star-count-value">0</span>
        </span>
        <button type="button" class="icon-btn" id="btn-infinite-mode" aria-pressed="false" title="Végtelen gyakorlás be/ki">
          ∞ <span class="btn-label">Végtelen</span>
        </button>
        <button type="button" class="icon-btn" id="btn-replay-voice" title="Feladat meghallgatása újra">
          🗣️ <span class="btn-label">Hallgasd</span>
        </button>
        <button type="button" class="icon-btn" id="btn-toggle-sound" aria-pressed="true" title="Hang ki/be">
          🔊
        </button>
      </div>
    </div>
  </header>

  <main class="container workshop-main">
    <nav class="mode-nav" aria-label="Játékmódok">
      <button type="button" class="mode-tab is-active" id="tab-mode-houses" data-mode="houses">
        <span>🏡</span>
        <span>1. Minden Házba!</span>
      </button>
      <button type="button" class="mode-tab" id="tab-mode-bridges" data-mode="bridges">
        <span>🌉</span>
        <span>2. Minden Hídon Át!</span>
      </button>
      <button type="button" class="mode-tab" id="tab-mode-possible" data-mode="possible">
        <span>🤔</span>
        <span>3. Lehet vagy Nem?</span>
      </button>
    </nav>

    <section class="game-panel" aria-live="polite">
      <div class="prompt-bar">
        <div class="prompt-left">
          <div class="guide-avatar" aria-hidden="true">🦔</div>
          <div>
            <span class="level-badge" id="level-badge">1. útvonal</span>
            <p class="prompt-instruction" id="prompt-instruction">Töltsük be az erdei térképet…</p>
          </div>
        </div>
        <div class="difficulty-bar" id="difficulty-bar" role="group" aria-label="Nehézségi szint">
          <button type="button" class="diff-btn is-active" data-diff="easy">🌱 Könnyű</button>
          <button type="button" class="diff-btn" data-diff="medium">⚡ Közepes</button>
          <button type="button" class="diff-btn" data-diff="hard">🔥 Nehéz</button>
        </div>
      </div>

      <div id="game-stage"></div>

      <div class="action-bar">
        <div class="feedback-banner" id="feedback-banner">
          <span>💡</span>
          <span id="feedback-text">Koppints egy szomszédos házikóra vagy szigetre a lépéshez!</span>
        </div>
        <div class="action-buttons" id="action-buttons"></div>
      </div>
    </section>
  </main>

  <script src="../shared/logika-core.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
